name: Chatbot Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test Level 1
        run: python -m unittest discover -s 01-rule-based -v

      - name: Test Level 2
        run: python -m unittest discover -s 02-keyword-matching -v

      - name: Test Level 3
        run: python -m unittest discover -s 03-intent-based -v

      - name: Test Level 4
        run: python -m unittest discover -s 04-llm -v

      - name: Test Level 5 - RAG
        run: python -m unittest discover -s 05-rag/tests -v